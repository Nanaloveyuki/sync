name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup MoonBit
        uses: ./.github/actions/setup-moonbit

      - name: Verify formatting and exported interfaces
        shell: bash
        run: |
          set -euo pipefail
          moon fmt --check
          moon info
          git diff --exit-code

      - name: Check native package
        shell: bash
        run: moon check --target native --deny-warn

  native:
    name: Native (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup MoonBit
        uses: ./.github/actions/setup-moonbit

      - name: Check and test debug profile
        shell: bash
        run: |
          set -euo pipefail
          moon check --target native --deny-warn
          moon test --target native --deny-warn

      - name: Test feature packages independently
        shell: bash
        run: |
          set -euo pipefail
          for package in atomic once wait_group rwlock channel unsafe/mutex unsafe/thread unsafe/channel unsafe/thread_pool; do
            moon test "src/$package" --target native --deny-warn
          done

      - name: Check and test release profile
        shell: bash
        run: |
          set -euo pipefail
          moon check --target native --release --deny-warn
          moon test --target native --release --deny-warn

      - name: Compile C stub with strict warnings (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r source; do
            feature="$(basename "$(dirname "$source")")"
            cc -std=c11 -Wall -Wextra -Werror -pthread \
              -I "$HOME/.moon/include" \
              -c "$source" \
              -o "$RUNNER_TEMP/sync-$feature.o"
          done < <(find src -mindepth 2 -name native.c -print | sort)

      - name: Compile C stub with strict warnings (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem src -Recurse -Filter native.c | ForEach-Object {
            $feature = $_.Directory.Name
            clang -std=c11 -Wall -Wextra -Werror `
              -I "$env:USERPROFILE\.moon\include" `
              -c $_.FullName `
              -o "$env:RUNNER_TEMP\sync-$feature.obj"
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }

      - name: Stress native concurrency paths
        shell: bash
        run: |
          set -euo pipefail
          for iteration in {1..10}; do
            moon test --target native --release --deny-warn --quiet
          done

  sanitizer:
    name: Sanitizers (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup MoonBit
        uses: ./.github/actions/setup-moonbit

      - name: Run native ASan and UBSan tests
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/run-asan.py --repo-root .

      - name: Verify dropped thread handles fail fast
        shell: bash
        run: |
          set -euo pipefail
          moon build src/test_programs/thread_drop_abort --target native --release --deny-warn
          build_dir="_build/native/release/build/test_programs/thread_drop_abort"
          binary="$(find "$build_dir" -maxdepth 1 -type f -perm -111 -print -quit)"
          if [ -z "$binary" ]; then
            echo "smoke binary was not produced in: $build_dir"
            exit 1
          fi
          set +e
          timeout --signal=KILL 30s "$binary"
          status=$?
          set -e
          case "$status" in
            0)
              echo "an unjoined thread handle did not fail fast"
              exit 1
              ;;
            124|137)
              echo "dropped-handle smoke test timed out"
              exit 1
              ;;
            125|126|127)
              echo "dropped-handle smoke test could not be executed: $status"
              exit 1
              ;;
            *)
              echo "dropped-handle smoke test exited with expected non-zero status: $status"
              ;;
          esac

  coverage:
    name: Coverage (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup MoonBit
        uses: ./.github/actions/setup-moonbit

      - name: Collect native MoonBit coverage
        shell: bash
        run: |
          set -euo pipefail
          moon coverage clean
          moon test --target native --deny-warn --enable-coverage
          moon coverage report -f summary
          moon coverage analyze
