name: Setup MoonBit
description: Install and verify the repository-pinned MoonBit toolchain.

inputs:
  toolchain-file:
    description: Toolchain version file relative to the repository root.
    required: false
    default: .moonbit-toolchain

runs:
  using: composite
  steps:
    - name: Install MoonBit on Unix
      if: runner.os != 'Windows'
      shell: bash
      run: |
        set -euo pipefail
        toolchain_file="$GITHUB_WORKSPACE/${{ inputs.toolchain-file }}"
        version="$(awk 'NF && $1 !~ /^#/ { print $1; exit }' "$toolchain_file")"
        if [[ -z "$version" ]]; then
          echo "::error::MoonBit toolchain file is empty: $toolchain_file" >&2
          exit 1
        fi

        curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s "$version"
        moon_bin="$HOME/.moon/bin/moon"
        version_log="${RUNNER_TEMP:-/tmp}/moonbit-version.txt"
        "$moon_bin" version --all | tee "$version_log"
        grep -Fq "$version" "$version_log"
        echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

    - name: Install MoonBit on Windows
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $toolchainFile = Join-Path $env:GITHUB_WORKSPACE '${{ inputs.toolchain-file }}'
        $version = Get-Content -LiteralPath $toolchainFile |
          ForEach-Object { $_.Trim() } |
          Where-Object { $_.Length -gt 0 -and -not $_.StartsWith('#') } |
          Select-Object -First 1
        if ([string]::IsNullOrWhiteSpace($version)) {
          throw "MoonBit toolchain file is empty: $toolchainFile"
        }

        $env:MOONBIT_INSTALL_VERSION = $version
        Invoke-RestMethod https://cli.moonbitlang.com/install/powershell.ps1 |
          Invoke-Expression
        $moon = Join-Path $env:USERPROFILE '.moon\bin\moon.exe'
        $versionOutput = & $moon version --all | Out-String
        Write-Host $versionOutput
        if (!$versionOutput.Contains($version)) {
          throw "Installed MoonBit toolchain does not match $version"
        }
        "$env:USERPROFILE\.moon\bin" |
          Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
